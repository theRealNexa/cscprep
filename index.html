// ─── APP STATE ───────────────────────────────────────────────────────────────
const COURSE_STORAGE_KEY = 'quizv3_active_course';
const COURSES = {
  '208': {
    q: CSC208,
    title: 'CSC 208 — Introduction to Computer Hardware',
    sub: 'Laboratory Quiz Platform'
  },
  '226': {
    q: CSC226,
    title: 'CSC 226 — Object-Oriented Programming 1 (C++)',
    sub: 'Theory & Code Tracing Quiz'
  },
  '218': {
    q: CSC218,
    title: 'CSC 218 — Foundation of Sequential Programming',
    sub: 'Theory, Architecture & Number Systems Quiz'
  },
  '212': {
    q: IFT212,
    title: 'IFT 212 — Computer Architecture and Organisation',
    sub: 'From Logic Gates to Memory Hierarchies & Multiprocessors'
  },
  '214': {
    q: CSC214,
    title: 'CSC 214 — Database Design and Management',
    sub: 'From ER Modelling to Normalisation, SQL & Client-Server Architecture'
  },
};

function loadActiveCourse() {
  try {
    const stored = localStorage.getItem(COURSE_STORAGE_KEY);
    if (stored && COURSES[stored]) return stored;
  } catch (e) {}
  return '208';
}

let activeCourse = loadActiveCourse();
const PER = 5;

function initState(course) {
  return {
    ans: {},
    f: 'All',
    p: 0,
    course
  };
}

function save() {
  try {
    localStorage.setItem('quizv3_' + activeCourse, JSON.stringify(S));
    localStorage.setItem(COURSE_STORAGE_KEY, activeCourse);
  } catch (e) {}
}

function loadCourse(course) {
  try {
    const d = localStorage.getItem('quizv3_' + course);
    if (d) {
      const p = JSON.parse(d);
      if (p && typeof p === 'object') {
        p.course = course;
        return p;
      }
    }
  } catch (e) {}
  return initState(course);
}

let S = loadCourse(activeCourse);

function switchCourse(code) {
  save();
  activeCourse = code;
  S = loadCourse(code);
  document.getElementById('course-select').value = code;
  const c = COURSES[code];
  document.getElementById('course-title').textContent = c.title;
  document.getElementById('course-subtitle').textContent = c.sub;
  render();
}

function resetQuiz() {
  if (!confirm('Reset all progress for this course? This cannot be undone.')) return;
  S = initState(activeCourse);
  save();
  render();
}

function getQ() {
  return COURSES[activeCourse].q;
}

function fq() {
  return S.f === 'All' ? getQ() : getQ().filter(q => q.t === S.f);
}

function getTopics() {
  const seen = new Set();
  const out = ['All'];
  getQ().forEach(q => {
    if (!seen.has(q.t)) {
      seen.add(q.t);
      out.push(q.t);
    }
  });
  return out;
}

function updateScores() {
  const keys = Object.keys(S.ans);
  const total = keys.length;
  const correct = keys.filter(k => S.ans[k].c).length;
  document.getElementById('sc-score').textContent = correct;
  document.getElementById('sc-ans').textContent = total;
  document.getElementById('sc-pct').textContent = total > 0 ? Math.round(correct / total * 100) + '%' : '—';
}

function updateProg() {
  const qs = fq();
  const n = qs.filter(q => S.ans[q.id]).length;
  const pct = qs.length > 0 ? Math.round(n / qs.length * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = n + ' of ' + qs.length + ' answered';
}

function renderPills() {
  document.getElementById('pills').innerHTML = getTopics().map(t =>
    `<button class="pill${S.f === t ? ' active' : ''}" onclick="sf('${t.replace(/'/g, "&#39;")}')">${t}</button>`
  ).join('');
}

function sf(t) {
  S.f = t;
  S.p = 0;
  save();
  renderPills();
  renderQs();
}

function go(d) {
  const max = Math.max(0, Math.ceil(fq().length / PER) - 1);
  S.p = Math.min(max, Math.max(0, S.p + d));
  save();
  renderQs();
}

function pick(qid, i) {
  if (S.ans[qid]) return;
  const q = getQ().find(x => x.id === qid);
  if (!q) return;
  S.ans[qid] = {
    i,
    c: i === q.a
  };
  save();
  const el = document.getElementById('qc' + qid);
  if (el) el.innerHTML = cardInner(q);
  updateScores();
  updateProg();
}

function formatQ(text) {
  return text.replace(/\n/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>');
}

function cardInner(q) {
  const a = S.ans[q.id];
  const locked = !!a;
  const opts = q.o.map((o, i) => {
    let cls = 'opt';
    if (locked) {
      if (i === q.a) cls += ' correct';
      else if (a && a.i === i) cls += ' wrong';
    }
    return `<button class="${cls}"${locked ? ' disabled' : ''} onclick="pick(${q.id},${i})">${String.fromCharCode(65 + i)}. ${o}</button>`;
  }).join('');
  const badge = locked ? (a.c ? '<span class="qresult-ok">Correct</span>' : '<span class="qresult-bad">Incorrect</span>') : '';
  const expCls = locked ? 'explanation open' : 'explanation';
  const innerCls = q.prose ? 'explanation-inner prose' : 'explanation-inner';
  return `
    <div class="qmeta"><span class="qnum">Q${q.id}</span><span class="qtopic">${q.t}</span>${badge}</div>
    <div class="qtext">${formatQ(q.q)}</div>
    <div class="options">${opts}</div>
    <div id="exp${q.id}" class="${expCls}"><div class="${innerCls}">${q.e}</div></div>`;
}

function renderQs() {
  const qs = fq();
  const pages = Math.max(1, Math.ceil(qs.length / PER));
  const max = pages - 1;
  if (S.p > max) S.p = max;
  const sl = qs.slice(S.p * PER, (S.p + 1) * PER);
  document.getElementById('qlist').innerHTML = sl.length === 0 ?
    '<div class="empty">No questions found for this topic.</div>' :
    sl.map(q => `<div class="qcard"><div class="qcard-body" id="qc${q.id}">${cardInner(q)}</div></div>`).join('');
  document.getElementById('page-label').textContent = `Page ${S.p + 1} of ${pages}`;
  document.getElementById('course-subtitle').textContent = S.f === 'All' ?
    COURSES[activeCourse].sub + ` — ${qs.length} questions` :
    `${S.f} — ${qs.length} questions`;
  updateProg();
}

function render() {
  const c = COURSES[activeCourse];
  document.getElementById('course-title').textContent = c.title;
  document.getElementById('course-subtitle').textContent = c.sub;
  renderPills();
  renderQs();
  updateScores();
}

// Initialize course dropdown
function initCourseDropdown() {
  const select = document.getElementById('course-select');
  select.innerHTML = '';
  Object.keys(COURSES).forEach(code => {
    const option = document.createElement('option');
    option.value = code;
    option.textContent = COURSES[code].title.split(' — ')[0];
    if (code === activeCourse) option.selected = true;
    select.appendChild(option);
  });
}

render();
initCourseDropdown();
</script>
</body>
</html>
